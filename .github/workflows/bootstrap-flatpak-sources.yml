name: Bootstrap Flatpak sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install generator dependencies
        run: sudo apt-get update && sudo apt-get install -y curl python3-aiohttp python3-tomlkit
      - name: Generate Flatpak Cargo sources
        run: |
          curl -fsSL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py -o /tmp/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Commit generated sources
        run: |
          if [ -z "$(git status --porcelain -- packaging/flatpak/cargo-sources.json)" ]; then
            echo "Generated Flatpak sources are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/flatpak/cargo-sources.json
          git commit -m "build: refresh locked Flatpak sources"
          git push
