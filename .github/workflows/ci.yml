name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev libxkbcommon-dev
      - name: Stabilize cosmic-text revision
        run: cargo update -p cosmic-text --precise a07a6190548c8e40a55f6b7761387047ff1bf6ff
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Prepare manual install bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/Ticker/bin
          git archive HEAD | tar -x -C dist/Ticker
          install -Dm0755 target/release/ticker dist/Ticker/bin/ticker
          if [ -f dist/Ticker/install.sh ]; then
            chmod +x dist/Ticker/install.sh
          fi
      - name: Upload manual install bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Ticker-manual-install
          path: dist/Ticker
          if-no-files-found: error
          retention-days: 30
