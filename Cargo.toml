[package]
name = "ticker"
version = "2.0.2"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Minimal COSMIC panel applet for SOL/USDT price and three configurable candles."
repository = "https://github.com/drwesleyadv/Ticker"

[dependencies]
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "7e82198ab1aba712640b0167e58ad37bf03012ca"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
